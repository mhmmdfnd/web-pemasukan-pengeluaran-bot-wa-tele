<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Keuangan Personal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-500/50 rounded-lg">
                    <i class="fa-solid fa-wallet text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Financial Tracker</h1>
                    <p class="text-xs text-indigo-200">Telegram Bot & Cloud Sync</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    Live Sync
                </span>
                <button onclick="loadTransactions()" class="p-2 hover:bg-indigo-500/40 rounded-lg transition text-indigo-100" title="Refresh Data">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Ringkasan Keuangan Cards -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <!-- Card Total Saldo -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Saldo Bersih</p>
                    <h2 id="total-saldo" class="text-2xl md:text-3xl font-extrabold text-slate-900 mt-1">Rp 0</h2>
                </div>
                <div class="p-3.5 bg-indigo-50 text-indigo-600 rounded-xl">
                    <i class="fa-solid fa-scale-balanced text-xl"></i>
                </div>
            </div>

            <!-- Card Total Pemasukan -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 flex items-center justify-between border-l-4 border-l-emerald-500">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Pemasukan</p>
                    <h2 id="total-pemasukan" class="text-2xl md:text-3xl font-extrabold text-emerald-600 mt-1">Rp 0</h2>
                </div>
                <div class="p-3.5 bg-emerald-50 text-emerald-600 rounded-xl">
                    <i class="fa-solid fa-arrow-down-left text-xl"></i>
                </div>
            </div>

            <!-- Card Total Pengeluaran -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 flex items-center justify-between border-l-4 border-l-rose-500">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Pengeluaran</p>
                    <h2 id="total-pengeluaran" class="text-2xl md:text-3xl font-extrabold text-rose-600 mt-1">Rp 0</h2>
                </div>
                <div class="p-3.5 bg-rose-50 text-rose-600 rounded-xl">
                    <i class="fa-solid fa-arrow-up-right text-xl"></i>
                </div>
            </div>
        </section>

        <!-- Section Grafik & Breakdown -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Chart Pengeluaran per Kategori -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 lg:col-span-1 flex flex-col justify-between">
                <h3 class="font-bold text-slate-800 text-base mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-indigo-600"></i> Kategori Pengeluaran
                </h3>
                <div class="relative w-full h-64 flex items-center justify-center">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <!-- Tabel Riwayat Transaksi -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 lg:col-span-2 overflow-hidden flex flex-col">
                <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row justify-between sm:items-center gap-3 bg-slate-50/50">
                    <div>
                        <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                            <i class="fa-solid fa-receipt text-indigo-600"></i> Riwayat Transaksi
                        </h3>
                        <p class="text-xs text-slate-500 mt-0.5">Otomatis tersinkronisasi dari Bot Telegram</p>
                    </div>
                </div>

                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100/70 text-slate-500 text-xs uppercase tracking-wider font-semibold">
                                <th class="p-3.5">Tanggal</th>
                                <th class="p-3.5">Deskripsi</th>
                                <th class="p-3.5">Kategori</th>
                                <th class="p-3.5">Tipe</th>
                                <th class="p-3.5 text-right">Jumlah</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-rows" class="divide-y divide-slate-100 text-sm">
                            <tr>
                                <td colspan="5" class="p-8 text-center text-slate-400">
                                    <i class="fa-solid fa-circle-notch animate-spin text-indigo-600 text-2xl"></i>
                                    <p class="mt-2 text-xs font-medium">Memuat data dari Neon DB...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript Handler -->
    <script>
        let categoryChartInstance = null;

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(number);
        }

        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('id-ID', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        async function loadTransactions() {
            try {
                const response = await fetch('/api/get-transactions');
                if (!response.ok) throw new Error('Network error');

                const data = await response.json();
                renderDashboard(data);
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('transaction-rows').innerHTML = `
                    <tr>
                        <td colspan="5" class="p-8 text-center text-rose-500">
                            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                            <p class="font-semibold text-sm">Gagal menghubungkan ke database Neon DB.</p>
                        </td>
                    </tr>
                `;
            }
        }

        function renderDashboard(transactions) {
            const tableBody = document.getElementById('transaction-rows');
            let totalIncome = 0;
            let totalExpense = 0;
            const categoryTotals = {};

            if (!transactions || transactions.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="p-8 text-center text-slate-400">
                            Belum ada transaksi. Kirim pesan ke Bot Telegram Anda untuk mencatat.
                        </td>
                    </tr>
                `;
                document.getElementById('total-saldo').innerText = 'Rp 0';
                document.getElementById('total-pemasukan').innerText = 'Rp 0';
                document.getElementById('total-pengeluaran').innerText = 'Rp 0';
                renderChart({});
                return;
            }

            let rowsHtml = '';

            transactions.forEach(item => {
                const amount = Number(item.amount) || 0;
                const isIncome = item.type === 'income';

                if (isIncome) {
                    totalIncome += amount;
                } else {
                    totalExpense += amount;
                    const cat = item.category || 'Lainnya';
                    categoryTotals[cat] = (categoryTotals[cat] || 0) + amount;
                }

                rowsHtml += `
                    <tr class="hover:bg-slate-50/80 transition-colors">
                        <td class="p-3.5 text-slate-400 text-xs whitespace-nowrap">${formatDate(item.created_at)}</td>
                        <td class="p-3.5 font-semibold text-slate-800">${item.title}</td>
                        <td class="p-3.5">
                            <span class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md text-xs font-medium">
                                ${item.category || 'Umum'}
                            </span>
                        </td>
                        <td class="p-3.5">
                            <span class="${isIncome ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'} text-xs px-2.5 py-1 rounded-md font-semibold">
                                ${isIncome ? 'Pemasukan' : 'Pengeluaran'}
                            </span>
                        </td>
                        <td class="p-3.5 text-right font-bold whitespace-nowrap ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
                            ${isIncome ? '+' : '-'} ${formatRupiah(amount)}
                        </td>
                    </tr>
                `;
            });

            // Update Total Ringkasan
            const netBalance = totalIncome - totalExpense;
            document.getElementById('total-saldo').innerText = formatRupiah(netBalance);
            document.getElementById('total-pemasukan').innerText = formatRupiah(totalIncome);
            document.getElementById('total-pengeluaran').innerText = formatRupiah(totalExpense);

            // Update Tabel
            tableBody.innerHTML = rowsHtml;

            // Render Chart
            renderChart(categoryTotals);
        }

        function renderChart(categoryData) {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            const labels = Object.keys(categoryData);
            const values = Object.values(categoryData);

            if (categoryChartInstance) {
                categoryChartInstance.destroy();
            }

            if (labels.length === 0) {
                return;
            }

            categoryChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: [
                            '#6366f1', '#10b981', '#f59e0b', '#ef4444', 
                            '#8b5cf6', '#ec4899', '#14b8a6', '#64748b'
                        ],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 11 },
                                boxWidth: 12
                            }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        // Init
        loadTransactions();
        setInterval(loadTransactions, 5000);
    </script>
</body>
</html>
