<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Keuangan Personal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-lg p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-wallet"></i> Keuangan Personal
            </h1>
            <span class="text-xs bg-indigo-700 px-3 py-1 rounded-full animate-pulse flex items-center gap-1">
                <span class="w-2 h-2 bg-green-400 rounded-full"></span> Live Sync
            </span>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">

        <!-- Ringkasan Saldo Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Total Saldo -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <p class="text-sm font-medium text-gray-500">Total Saldo Bersih</p>
                <h2 id="total-saldo" class="text-2xl font-bold text-gray-900 mt-1">Rp 0</h2>
            </div>
            
            <!-- Total Pemasukan -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-green-500">
                <p class="text-sm font-medium text-gray-500">Total Pemasukan</p>
                <h2 id="total-pemasukan" class="text-2xl font-bold text-green-600 mt-1">Rp 0</h2>
            </div>

            <!-- Total Pengeluaran -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-red-500">
                <p class="text-sm font-medium text-gray-500">Total Pengeluaran</p>
                <h2 id="total-pengeluaran" class="text-2xl font-bold text-red-600 mt-1">Rp 0</h2>
            </div>
        </div>

        <!-- Tabel Riwayat Transaksi -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-gray-700 flex items-center gap-2">
                    <i class="fa-solid fa-list text-indigo-600"></i> Riwayat Transaksi
                </h3>
                <button onclick="loadTransactions()" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> Refresh Data
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-xs uppercase font-semibold">
                            <th class="p-3">Tanggal</th>
                            <th class="p-3">Deskripsi</th>
                            <th class="p-3">Kategori</th>
                            <th class="p-3">Tipe</th>
                            <th class="p-3 text-right">Jumlah</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-rows" class="divide-y divide-gray-100 text-sm">
                        <!-- Data transaksi akan otomatis dirender di sini -->
                        <tr>
                            <td colspan="5" class="p-6 text-center text-gray-400">
                                <i class="fa-solid fa-circle-notch animate-spin text-indigo-600 text-xl"></i>
                                <p class="mt-2 text-xs">Memuat data transaksi...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Script Pengambil & Pemroses Data -->
    <script>
        // Format Angka ke Rupiah
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(number);
        }

        // Format Tanggal
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('id-ID', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Fungsi Mengambil Data dari Backend /api/get-transactions
        async function loadTransactions() {
            try {
                const response = await fetch('/api/get-transactions');
                if (!response.ok) throw new Error('Gagal mengambil data');

                const data = await response.json();
                renderDashboard(data);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('transaction-rows').innerHTML = `
                    <tr>
                        <td colspan="5" class="p-6 text-center text-red-500">
                            <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                            <p class="mt-1 font-semibold">Gagal memuat data dari database.</p>
                        </td>
                    </tr>
                `;
            }
        }

        // Fungsi Merender Tampilan Dashboard
        function renderDashboard(transactions) {
            const tableBody = document.getElementById('transaction-rows');
            
            let totalIncome = 0;
            let totalExpense = 0;

            if (!transactions || transactions.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="p-6 text-center text-gray-400">
                            Belum ada transaksi tercatat. Kirim pesan di Telegram untuk mulai mencatat.
                        </td>
                    </tr>
                `;
                document.getElementById('total-saldo').innerText = 'Rp 0';
                document.getElementById('total-pemasukan').innerText = 'Rp 0';
                document.getElementById('total-pengeluaran').innerText = 'Rp 0';
                return;
            }

            let rowsHtml = '';

            transactions.forEach(item => {
                const amount = Number(item.amount) || 0;
                const isIncome = item.type === 'income';

                if (isIncome) {
                    totalIncome += amount;
                } else {
                    totalExpense += amount;
                }

                rowsHtml += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="p-3 text-gray-500 text-xs">${formatDate(item.created_at)}</td>
                        <td class="p-3 font-semibold text-gray-800">${item.title}</td>
                        <td class="p-3">
                            <span class="bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs">
                                ${item.category || 'Umum'}
                            </span>
                        </td>
                        <td class="p-3">
                            <span class="${isIncome ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} text-xs px-2 py-1 rounded font-medium">
                                ${isIncome ? 'Pemasukan' : 'Pengeluaran'}
                            </span>
                        </td>
                        <td class="p-3 text-right font-bold ${isIncome ? 'text-green-600' : 'text-red-600'}">
                            ${isIncome ? '+' : '-'} ${formatRupiah(amount)}
                        </td>
                    </tr>
                `;
            });

            // Update Total Ringkasan
            const netBalance = totalIncome - totalExpense;
            document.getElementById('total-saldo').innerText = formatRupiah(netBalance);
            document.getElementById('total-pemasukan').innerText = formatRupiah(totalIncome);
            document.getElementById('total-pengeluaran').innerText = formatRupiah(totalExpense);

            // Update Tabel
            tableBody.innerHTML = rowsHtml;
        }

        // Panggil fungsi saat halaman dibuka pertama kali
        loadTransactions();

        // Otomatis refresh data setiap 5 detik (Auto-sync)
        setInterval(loadTransactions, 5000);
    </script>
</body>
</html>
